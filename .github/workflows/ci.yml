
name: CI Pipeline Multi-Jobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  lint:
    name: Vérification du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le code avec Flake8
        run: python -m flake8 app tests --max-line-length=127

  tests:
    name: Exécution des tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter les tests Pytest
        run: python -m pytest -v

  coverage:
    name: Couverture des tests
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer la couverture
        run: python -m pytest --cov=app --cov-report=term-missing
